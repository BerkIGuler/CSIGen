name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The tested versions of the README, and the newest versions that pip resolves
        pins: ["numpy==2.5.3 PyYAML==6.0.3 pydantic==2.14.0", ""]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The tests read saved data and configs, which need neither Sionna RT nor a GPU, so the base install is enough
      - run: pip install -e ".[test]" ${{ matrix.pins }}
      - run: pytest
